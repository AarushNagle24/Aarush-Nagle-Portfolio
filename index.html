<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aarush-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          var theme = stored || system;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <title>Aarush Nagle | Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Aarush Nagle, a third-year Computer Science student at the University of Virginia."
    />
    <link rel="canonical" href="https://aarushnagle24.github.io/Aarush-Nagle-Portfolio/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#10151f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aarush Nagle | Software Developer" />
    <meta
      property="og:description"
      content="Computer Science at UVA, large-scale Roblox development, AI tools, and practical software projects."
    />
    <meta
      property="og:image"
      content="https://aarushnagle24.github.io/Aarush-Nagle-Portfolio/images/tower-of-easy.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var isLocal =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '::1';
        var hasBuiltBundle = Array.prototype.some.call(document.scripts, function (script) {
          return /\/assets\/index\.js(?:$|\?)/.test(script.src);
        });

        if (hasBuiltBundle) {
          return;
        }

        var loadBuiltBundle = function () {
          if (document.querySelector('#root') && document.querySelector('#root').children.length) {
            return;
          }

          var base = location.pathname.indexOf('/Aarush-Nagle-Portfolio/') === 0
            ? '/Aarush-Nagle-Portfolio/'
            : '/';
          var stylesheet = document.createElement('link');
          stylesheet.rel = 'stylesheet';
          stylesheet.href = base + 'assets/index.css';
          document.head.appendChild(stylesheet);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = base + 'assets/index.js';
          document.body.appendChild(script);
        };

        if (isLocal) {
          window.setTimeout(loadBuiltBundle, 1200);
          return;
        }

        loadBuiltBundle();
      })();
    </script>
  </body>
</html>
